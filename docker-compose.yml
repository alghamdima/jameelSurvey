services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jameel_surveys_app
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli.bootstrap && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 3 --loop uvloop --http httptools"]
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/surveys.db
      - EMPLOYEE_CSV_PATH=
    volumes:
      - survey_data:/app/data
      - survey_uploads:/app/app/static/uploads
    networks:
      - jameelbi-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  survey_uploads:
  survey_data:
    name: jameel_surveys_data

networks:
  jameelbi-net:
    name: ${SURVEY_NETWORK_NAME:-jameelbi-net}
    external: ${SURVEY_NETWORK_EXTERNAL:-false}
