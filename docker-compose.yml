services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jameel_surveys_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/surveys.db
    volumes:
      - survey_data:/app/data
      - ./app:/app/app
      - ./locales:/app/locales
      - ./alembic:/app/alembic
      - ./.env:/app/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  survey_data:
    name: jameel_surveys_data
